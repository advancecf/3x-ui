name: Release 3X-UI

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"

jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build 3X-UI (Linux amd64)
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64

          # ---- Bootlin toolchain ----
          BOOTLIN_ARCH="x86-64"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\.tar\.xz" | sort -r | head -n1)

          cd /tmp
          curl -fLO "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$TARBALL_URL"

          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*")
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export CC=$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' | head -n1)

          cd -

          go build -ldflags "-w -s -linkmode external -extldflags '-static'" -o xui-release main.go

          mkdir -p x-ui/bin
          mv xui-release x-ui/x-ui
          cp x-ui.service.* x-ui/
          cp x-ui.sh x-ui/

          # ---- Xray ----
          cd x-ui/bin
          wget -q https://github.com/XTLS/Xray-core/releases/download/v26.1.18/Xray-linux-64.zip
          unzip Xray-linux-64.zip
          rm Xray-linux-64.zip

          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          wget -q -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          wget -q -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          wget -q -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat

          mv xray xray-linux-amd64
          cd ../..

      - name: Package
        run: tar -czf x-ui-linux-amd64.tar.gz x-ui

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-amd64
          path: x-ui-linux-amd64.tar.gz

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: x-ui-linux-amd64.tar.gz
          asset_name: x-ui-linux-amd64.tar.gz
          overwrite: true
          prerelease: true
